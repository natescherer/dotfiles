# Per-user default file-type associations to set on Windows.
#
# Applied by .chezmoiscripts/41-windows/run_after_windows-file-associations.ps1.tmpl via
# Set-FileAssoc.ps1 (a vendored, no-admin-required reimplementation of the UserChoice hash --
# see AppData/Local/WindowsWorkstationDSC/Set-FileAssoc.ps1 for provenance/license/why this
# exists instead of a downloaded third-party tool).
#
# Each entry's app is resolved to a ProgId at apply time via the app's own
# RegisteredApplications\...\Capabilities\FileAssociations registry entry (not hardcoded here,
# since a ProgId can drift between app versions) -- appNameMatch is matched (-match, so it's a
# regex) against RegisteredApplications entry names and must match exactly one installed app.
[[windows_file_associations]]
extension = ".mp4"
appNameMatch = "VLC"
