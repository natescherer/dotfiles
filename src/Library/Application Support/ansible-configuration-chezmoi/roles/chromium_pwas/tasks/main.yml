---
- name: Check whether Chromium is installed
  ansible.builtin.stat:
    path: "/Applications/Chromium.app"
  register: chromium_app

# Chromium reads WebAppInstallForceList (and other enterprise policies) only
# from the "Managed Preferences" domain, not a regular ~/Library/Preferences
# plist — a plain `defaults write org.chromium.Chromium ...` would land in
# the wrong domain and Chromium would silently ignore it. Writing the plist
# straight to /Library/Managed Preferences/ is the same thing an MDM profile
# would ultimately deliver, just without needing MDM. This is a *forced*
# install — Chromium will show "managed by your organization" and the app
# can't be freely removed the normal way — traded deliberately for getting
# a real, manifest-icon-having, chrome://apps-tracked install out of a
# script.
# /Library/Managed Preferences isn't guaranteed to exist — it's normally
# created the first time a configuration profile/MDM enrollment lands on
# the Mac, which may never have happened on a fresh install.
- name: Ensure /Library/Managed Preferences exists
  ansible.builtin.file:
    path: "/Library/Managed Preferences"
    state: directory
    owner: root
    group: wheel
    mode: "0755"
  become: true
  when: chromium_app.stat.exists and chromium_web_apps | length > 0

- name: Force-install PWAs in Chromium
  ansible.builtin.template:
    src: org.chromium.Chromium.plist.j2
    dest: "/Library/Managed Preferences/org.chromium.Chromium.plist"
    owner: root
    group: wheel
    mode: "0644"
  become: true
  register: chromium_policy
  when: chromium_app.stat.exists and chromium_web_apps | length > 0

# The install-attempt/placeholder-repair chain below used to run only
# `when: chromium_policy is changed`. That's wrong on its own: once the
# plist has been written once, its content stays the same on every later
# run even if a given PWA never actually finished installing (e.g. a
# heavier site than the others doesn't fail over to a placeholder before
# the timeout further down kills Chromium). With only the "changed" gate,
# such a PWA would be stuck forever with nothing installed and no error,
# since every subsequent run would see no plist diff and skip the whole
# chain. Counting actual installed bundles and re-attempting whenever
# there are fewer than expected means a slow/failed entry keeps getting
# retried on future runs instead of going silently stale.
- name: Count already-installed (non-placeholder) PWAs
  ansible.builtin.find:
    paths: "{{ ansible_facts.env.HOME }}/Applications/Chromium Apps.localized"
    patterns: "*.app"
    excludes: "http*.app"
    file_type: directory
  register: chromium_existing_pwas
  when: chromium_app.stat.exists and chromium_web_apps | length > 0

- name: Determine whether Chromium needs to (re)attempt installing PWAs
  ansible.builtin.set_fact:
    chromium_pwas_need_attempt: "{{ chromium_policy is changed or (chromium_existing_pwas.matched | default(0)) < (chromium_web_apps | length) }}"
  when: chromium_app.stat.exists and chromium_web_apps | length > 0

# cfprefsd (the daemon every app, including Chromium, actually queries for
# preference values -- including the Managed Preferences domain) caches
# values in memory and doesn't reliably notice a plist being overwritten by
# a plain file write rather than through the normal preferences API.
# Confirmed on-device: after adding paramountplus.com, the plist on disk
# had the new entry (verified with `plutil -p`), but chrome://policy kept
# showing only the old (youtube-only) list -- Chromium was reading
# cfprefsd's stale cache, not the file. This isn't limited to the run that
# actually wrote the change, either: a stale cache from an earlier run
# stays stale forever since the plist's on-disk content won't change again
# on its own -- so this is gated on chromium_pwas_need_attempt (not
# `chromium_policy is changed`) to also cover exactly that already-stale
# case. Killing cfprefsd forces it to reread from disk; it's relaunched on
# demand automatically.
- name: Restart cfprefsd so Chromium picks up the current policy
  ansible.builtin.command: killall cfprefsd
  become: true
  when: chromium_pwas_need_attempt | default(false) | bool
  changed_when: true
  failed_when: false

# Chromium only actually acts on WebAppInstallForceList — downloading each
# app's manifest/icon and creating the installed web app — once it's
# actually running. Launching it in the background, waiting for the
# installed .app bundles to actually show up, then quitting is the least
# disruptive way to make this happen non-interactively, rather than
# requiring someone to open the browser by hand after every run. Only
# bother doing this when there's actually something left to install, so a
# re-run where every PWA already installed successfully doesn't interrupt
# an already-running Chromium for no reason.
- name: Launch Chromium so it installs the forced PWAs
  ansible.builtin.command: open -g -a Chromium
  when: chromium_pwas_need_attempt | default(false) | bool

# Confirmed on-device: ungoogled-chromium uses "Chromium Apps.localized"
# here (unlike upstream Chromium/Chrome, which hardcodes "Chrome Apps" per
# its source — this fork apparently derives it from the product name
# instead). If a future build ever changes this, the task will just retry
# for a couple of minutes and move on (failed_when: false below) rather
# than blocking the whole run on it.
- name: Wait for Chromium's initial install attempt to finish
  ansible.builtin.find:
    paths: "{{ ansible_facts.env.HOME }}/Applications/Chromium Apps.localized"
    patterns: "*.app"
    file_type: directory
  register: chromium_installed_pwas
  until: chromium_installed_pwas.matched | default(0) >= (chromium_web_apps | length)
  retries: 24
  delay: 5
  when: chromium_pwas_need_attempt | default(false) | bool
  failed_when: false

# When the hidden background page load behind a forced install fails
# (timeout, redirect, or the browser being quit mid-load), Chromium falls
# back to installing a "placeholder" app named after the install URL (e.g.
# `https/www.youtube.com.app`), with no manifest name or icon. Chromium
# replaces a placeholder with the real manifest-derived app as soon as any
# tab successfully navigates to the placeholder's install URL — the same
# fully-rendered path a manual "Install" click uses. See
# https://chromium.googlesource.com/chromium/src/+/main/docs/webapps/concepts.md
# So: detect URL-named bundles, and if any exist, open every install URL in
# a background tab to trigger that replacement.
- name: Check for placeholder PWA installs
  ansible.builtin.find:
    paths: "{{ ansible_facts.env.HOME }}/Applications/Chromium Apps.localized"
    patterns: "http*.app"
    file_type: directory
  register: chromium_placeholder_pwas
  when: chromium_pwas_need_attempt | default(false) | bool

- name: Open install URLs in tabs so Chromium replaces the placeholders
  ansible.builtin.command:
    argv: "{{ ['open', '-g', '-a', 'Chromium'] + (chromium_web_apps | map(attribute='url') | list) }}"
  when: (chromium_pwas_need_attempt | default(false) | bool) and (chromium_placeholder_pwas.matched | default(0) > 0)
  changed_when: true

- name: Wait for placeholders to be replaced by real apps
  ansible.builtin.find:
    paths: "{{ ansible_facts.env.HOME }}/Applications/Chromium Apps.localized"
    patterns: "http*.app"
    file_type: directory
  register: chromium_remaining_placeholders
  until: chromium_remaining_placeholders.matched | default(0) == 0
  retries: 24
  delay: 5
  when: (chromium_pwas_need_attempt | default(false) | bool) and (chromium_placeholder_pwas.matched | default(0) > 0)
  failed_when: false

- name: Quit Chromium
  ansible.builtin.command: killall Chromium
  when: chromium_pwas_need_attempt | default(false) | bool
  changed_when: true
  failed_when: false
