---
- name: Install base apt packages
  ansible.builtin.apt:
    name: "{{ apt_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Set zsh as the login shell
  ansible.builtin.user:
    name: "{{ ansible_facts.user_id }}"
    shell: /usr/bin/zsh
  become: true
