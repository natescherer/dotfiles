---
# Values are GVariant text: strings need their own single quotes inside the YAML string.
#
# color-scheme: dark mode for libadwaita/GTK4 apps; gtk-theme covers GTK3 apps.
- name: Configure appearance
  community.general.dconf:
    key: "/org/gnome/desktop/interface/{{ item.key }}"
    value: "{{ item.value }}"
    state: present
  loop:
    - { key: color-scheme, value: "'prefer-dark'" }
    - { key: gtk-theme, value: "'Yaru-dark'" }
    - { key: show-battery-percentage, value: "true" }

# Requires Location Services (Settings > Privacy > Location) to take effect.
- name: Set time zone automatically using current location
  community.general.dconf:
    key: /org/gnome/desktop/datetime/automatic-timezone
    value: "true"
    state: present

# Ubuntu Dock is a build of Dash to Dock. dock-fixed true keeps it from autohiding.
- name: Configure Dock behavior
  community.general.dconf:
    key: "/org/gnome/shell/extensions/dash-to-dock/{{ item.key }}"
    value: "{{ item.value }}"
    state: present
  loop:
    - { key: dash-max-icon-size, value: "44" }
    - { key: dock-fixed, value: "true" }
    - { key: dock-position, value: "'BOTTOM'" }

# Files reads hidden-file and folder-sorting preferences from the GTK4 file chooser schema.
- name: Configure Files behavior
  community.general.dconf:
    key: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
  loop:
    - { key: /org/gnome/nautilus/preferences/default-folder-viewer, value: "'list-view'" }
    - { key: /org/gtk/gtk4/settings/file-chooser/show-hidden, value: "true" }
    - { key: /org/gtk/gtk4/settings/file-chooser/sort-directories-first, value: "true" }

# accel-profile flat turns off pointer acceleration.
- name: Configure pointing devices
  community.general.dconf:
    key: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
  loop:
    - { key: /org/gnome/desktop/peripherals/touchpad/tap-to-click, value: "true" }
    - { key: /org/gnome/desktop/peripherals/mouse/accel-profile, value: "'flat'" }

# report-technical-problems also controls Ubuntu's crash reporting (apport/whoopsie).
- name: Disable problem reporting and usage statistics
  community.general.dconf:
    key: "/org/gnome/desktop/privacy/{{ item }}"
    value: "false"
    state: present
  loop:
    - report-technical-problems
    - send-software-usage-stats

# Sleep after 15 minutes on battery and never on the power adapter, or never at all on VMs.
# Timeouts are in seconds.
- name: Configure idle sleep
  community.general.dconf:
    key: "/org/gnome/settings-daemon/plugins/power/{{ item.key }}"
    value: "{{ item.value }}"
    state: present
  loop:
    - { key: sleep-inactive-ac-type, value: "'nothing'" }
    - { key: sleep-inactive-battery-timeout, value: "900" }
    - { key: sleep-inactive-battery-type, value: "{{ is_vm | ternary(\"'nothing'\", \"'suspend'\") }}" }

# idle-delay blanks the display after 10 minutes on either power source. lock-delay counts from
# there, so the screen locks at 20 minutes; on battery, sleep at 15 minutes comes first and locks.
# VMs never blank or lock: an idle-delay of 0 means never.
- name: Configure display blanking and screen lock
  community.general.dconf:
    key: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
  loop:
    - { key: /org/gnome/desktop/screensaver/lock-delay, value: "uint32 600" }
    - { key: /org/gnome/desktop/screensaver/lock-enabled, value: "{{ is_vm | ternary('false', 'true') }}" }
    - { key: /org/gnome/desktop/screensaver/ubuntu-lock-on-suspend, value: "{{ is_vm | ternary('false', 'true') }}" }
    - { key: /org/gnome/desktop/session/idle-delay, value: "{{ is_vm | ternary('uint32 0', 'uint32 600') }}" }

- name: Create logind drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    mode: "0755"
  become: true

# Keeps the machine awake with the lid closed on power, so it stays reachable. Restarting logind
# would end the desktop session, so this takes effect at next boot.
- name: Ignore lid close on power adapter
  ansible.builtin.copy:
    dest: /etc/systemd/logind.conf.d/50-chezmoi.conf
    content: |
      [Login]
      HandleLidSwitchExternalPower=ignore
    mode: "0644"
  become: true

# Personal machines only. ufw's defaults deny incoming and allow outgoing traffic.
- name: Enable the firewall
  community.general.ufw:
    state: enabled
  become: true
  when: is_personal_machine
