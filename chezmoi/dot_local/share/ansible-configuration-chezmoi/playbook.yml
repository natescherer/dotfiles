---
- name: Build a new Ubuntu desktop
  hosts: ubuntu
  connection: local
  gather_facts: true

  tasks:
    - ansible.builtin.include_role:
        name: apt_base
      tags: apt_base

    - ansible.builtin.include_role:
        name: homebrew
      tags: homebrew

    - ansible.builtin.include_role:
        name: apt_repos
      tags: apt_repos

    - ansible.builtin.include_role:
        name: snaps
      tags: snaps
