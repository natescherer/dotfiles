---
- name: Build a new Ubuntu desktop
  hosts: ubuntu
  connection: local
  gather_facts: true

  tasks:
    - ansible.builtin.include_role:
        name: apt_base
      tags: apt_base

    - ansible.builtin.include_role:
        name: homebrew
      tags: homebrew

    - ansible.builtin.include_role:
        name: apt_repos
      tags: apt_repos

    - ansible.builtin.include_role:
        name: snaps
      tags: snaps

    - ansible.builtin.include_role:
        name: gnome_settings
      tags: gnome_settings

    - ansible.builtin.include_role:
        name: pwas
      tags: pwas

    - ansible.builtin.include_role:
        name: app_associations
      tags: app_associations

    - ansible.builtin.include_role:
        name: dock_pins
      tags: dock_pins

    - ansible.builtin.include_role:
        name: wallpaper
      tags: wallpaper

    - ansible.builtin.include_role:
        name: mpm_plan
      tags: mpm_plan
