---
# Vendor apt repos
apt_repos:
  - name: azure-cli
    uris: https://packages.microsoft.com/repos/azure-cli
    suites: "{{ ansible_facts.distribution_release }}"
    components: main
    signed_by: https://packages.microsoft.com/keys/microsoft.asc
    packages:
      - azure-cli
  - name: google-cloud-cli
    uris: https://packages.cloud.google.com/apt
    suites: cloud-sdk
    components: main
    signed_by: https://packages.cloud.google.com/apt/doc/apt-key.gpg
    packages:
      - google-cloud-cli

# Vendor .deb packages with no apt repo. "{version}" in url is replaced with version; entries without
# a version install the latest download once and are left to update themselves.
apt_debs:
  - package: gcm
    # renovate: datasource=github-releases depName=git-ecosystem/git-credential-manager
    version: "3.0.1"
    url: https://github.com/git-ecosystem/git-credential-manager/releases/download/v{version}/gcm-linux-x64-{version}.deb
