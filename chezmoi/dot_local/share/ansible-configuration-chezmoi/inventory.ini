[ubuntu]
# The system Python, since the apt, deb822_repository, and dconf modules need its python3-apt,
# python3-debian, and python3-gi bindings; Homebrew's Ansible runs under a Python that lacks them.
#
# Classic sudo (sudo.ws) for become: Ubuntu's default sudo-rs wraps Ansible's password prompt in
# its own, so Ansible never detects it. Remove once Homebrew's ansible-core includes
# https://github.com/ansible/ansible/pull/86964 (2.22).
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3 ansible_become_exe=/usr/bin/sudo.ws
