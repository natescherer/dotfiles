## WARNING: This file is chezmoi-managed and should not be manually edited!

# chezmoi, plus the tools the dotfiles' git and zsh config expect, for machines
# without OS package lists to provide them: servers, WSL, and devcontainers.
# NixOS gets them from its flake instead, since mise's generic Linux binaries
# don't run there.
[tools]
chezmoi = "2.74.1"
delta = "0.21.2"
fzf = "0.75.0"
sheldon = "0.8.5"
starship = "1.27.0"
