[vscode]

# VS Code's Default profile is deliberately kept minimal (see its "Default" profile entry below)
# to nudge you into picking a real profile instead of leaving everything piled into one, so it's
# the one profile excluded from all_profile_extensions.
default_profile_is_placeholder = true

# Extensions applied to every profile except Default (which is deliberately kept minimal -- see
# its comment below). An entry can optionally gate itself with whenTrue and/or whenFalse, same
# semantics as .chezmoidata/windows-ini-patches.toml: each is a list of top-level chezmoi variable
# names (e.g. "isPersonal", "isVM" -- not dotted/nested paths); whenTrue requires every named
# variable to be true, whenFalse requires every named variable to be anything other than true.
all_profile_extensions = [
  { id = "alefragnani.bookmarks" }, # Code Bookmarks
  { id = "anthropic.claude-code", whenTrue = ["isPersonal"] },  # Claude Code
  { id = "editorconfig.editorconfig" },  # EditorConfig support, see https://editorconfig.org/
  { id = "github.vscode-github-actions" }, # GitHub Actions support
  { id = "GitHub.vscode-pull-request-github", whenTrue = ["isPersonal"] }, # GitHub PR/Issue browser
  { id = "hverlin.mise-vscode" },  # Env vars, local tools, tasks all-in-one
  { id = "jimeh.actionlint" },  # GitHub Actions linter
  { id = "maptz.regionfolder" }, # Region folding support for all languages
  { id = "mechatroner.rainbow-csv" },  # Improves CSV viewing
  { id = "ms-azure-devops.azure-pipelines" },  # Azure Pipelines support
  { id = "oderwat.indent-rainbow" },  # Improves indent visibility
  { id = "owenlamont.ryl" },  # YAML linter/formatter
  { id = "redhat.vscode-yaml" },  # Core YAML support
  { id = "rvben.rumdl" },  # Markdown linter/formatter
  { id = "tekumara.typos-vscode" },  # Intelligent spell checker
  { id = "tombi-toml.tombi" },  # TOML linter/formatter
  { id = "usernamehw.errorlens" }  # Highlights errors and warnings inline
]

[vscode.extension_sets]
# Extension sets can be reused across multiple profiles
jupyter = [
  "ms-toolsai.jupyter",  # Jupyter extension
  "ms-toolsai.jupyter-keymap",  # Jupyter keymap
  "ms-toolsai.jupyter-renderers",  # Jupyter renderers
  "ms-toolsai.vscode-jupyter-cell-tags",  # Jupyter cell tags
  "ms-toolsai.vscode-jupyter-slideshow",  # Jupyter slideshow
]

python = [
  "astral-sh.ty",  # Type checking and language server, also replaces Pylance
  "charliermarsh.ruff",  # Python linter and formatter
  "ms-python.debugpy",  # Python debugger
  "ms-python.python",  # Core extension for Python support
  "ms-python.vscode-pylance",  # Python language server
  "ms-python.vscode-python-envs",  # Python environment management, integrates with uv
  "samuelcolvin.jinjahtml",  # Support for jinja templates
]

containers = [
  "ms-vscode-remote.remote-containers",  # Devcontainer support
]

[[vscode.profiles]]
name = "Default"
# Default profile doesn't have a custom icon in the VS Code UI
settings_files = [".chezmoitemplates/editors/reusable-settings/core.json", ".chezmoitemplates/editors/profile-settings/default.json"]
extension_sets = []
extensions = [
  "bardleware.sandstorm",  # Red theme to act as an indicator that you need to choose a profile
]

[[vscode.profiles]]
name = "Chezmoi"
icon = "home"
settings_files = [".chezmoitemplates/editors/reusable-settings/core.json", ".chezmoitemplates/editors/profile-settings/python.json"]
extension_sets = ["python"]
extensions = [
  "ms-vscode.powershell",  # PowerShell extension
  "igorkramar.gotmpl-yaml-highlighter", # YAML Go template highlighting for Chezmoi
]

[[vscode.profiles]]
name = "Kubernetes"
icon = "server"
settings_files = [".chezmoitemplates/editors/reusable-settings/core.json", ".chezmoitemplates/editors/profile-settings/python.json", ".chezmoitemplates/editors/profile-settings/kubernetes.json"]
extension_sets = ["python"]
extensions = [
  "ms-kubernetes-tools.vscode-kubernetes-tools",
  "igorkramar.gotmpl-yaml-highlighter", # YAML Go template highlighting for Helmfile
]

[[vscode.profiles]]
name = "Nix"
icon = "terminal-linux"
settings_files = [".chezmoitemplates/editors/reusable-settings/core.json", ".chezmoitemplates/editors/profile-settings/nix.json"]
extension_sets = ["containers"]
extensions = [
  "jnoortheen.nix-ide",  # Nix language server
  "signageos.signageos-vscode-sops",  # SOPS support for secret management
]

[[vscode.profiles]]
name = "PowerShell"
icon = "terminal"
settings_files = [".chezmoitemplates/editors/reusable-settings/core.json", ".chezmoitemplates/editors/profile-settings/powershell.json"]
extension_sets = []
extensions = [
  "ms-vscode.powershell",  # PowerShell extension
]

[[vscode.profiles]]
name = "Python"
icon = "snake"
settings_files = [".chezmoitemplates/editors/reusable-settings/core.json", ".chezmoitemplates/editors/profile-settings/python.json"]
extension_sets = ["python", "jupyter"]
extensions = []

[[vscode.profiles]]
name = "Terraform"
icon = "paintcan"
settings_files = [".chezmoitemplates/editors/reusable-settings/core.json", ".chezmoitemplates/editors/profile-settings/python.json", ".chezmoitemplates/editors/profile-settings/terraform.json"]
extension_sets = ["python"]
extensions =  [
  "hashicorp.terraform",
]

[[vscode.profiles]]
name = "Web"
icon = "compass"
settings_files = [".chezmoitemplates/editors/reusable-settings/core.json", ".chezmoitemplates/editors/profile-settings/web.json"]
extension_sets = []
extensions = [
  "biomejs.biome",
  "deque-systems.vscode-axe-linter",
  "ms-vscode.live-server",
]

# VSCodium is a lightweight, cross-platform, general-purpose text editor -- unlike the VS Code
# profiles above, it's not meant for per-language IDE work (that's what VS Code's profiles are
# for), so it gets just one profile with a small, generalist extension set. It also can't use most
# of VS Code's IDE tooling anyway: VSCodium points at Open VSX instead of the Microsoft Marketplace
# by default, and Microsoft-published extensions (Pylance, the Kubernetes tools, Remote-SSH, etc.)
# aren't published there.
#
# Its "Default" profile is the one VSCodium actually opens into, unlike VS Code's -- so, unlike
# there, it's real and gets the full all_profile_extensions treatment.
[vscodium]
default_profile_is_placeholder = false

all_profile_extensions = [
  { id = "anthropic.claude-code", whenTrue = ["isPersonal"] },  # Claude Code
]

[vscodium.extension_sets]

[[vscodium.profiles]]
name = "Default"
settings_files = [".chezmoitemplates/editors/reusable-settings/core.json", ".chezmoitemplates/editors/profile-settings/vscodium-general.json"]
extension_sets = []
extensions = [
  "dracula-theme.theme-dracula",  # Distinct dark theme, so a VSCodium window is recognizable at a glance next to VS Code
  "mechatroner.rainbow-csv",  # Improves CSV viewing
  "oderwat.indent-rainbow",  # Improves indent visibility
  "owenlamont.ryl",  # YAML linter/formatter
  "redhat.vscode-yaml",  # Core YAML support
  "rvben.rumdl",  # Markdown linter/formatter
  "tekumara.typos-vscode",  # Intelligent spell checker
  "tombi-toml.tombi",  # TOML linter/formatter
  "usernamehw.errorlens",  # Highlights errors and warnings inline
]
