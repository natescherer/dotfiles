[pwas]

# PWAs to install as standalone apps with PWAsForFirefox (https://pwasforfirefox.filips.si), which
# runs them on a separate Firefox runtime with Widevine DRM. macOS, Ubuntu, and Windows install this
# list into a dedicated PWAsForFirefox profile, and remove apps from that profile once they leave it.
# NixOS declares the same apps through its flake, which needs each entry to have a name and a committed
# icon named after it.
#
# Keys:
# - url: the page the app opens. Its <link rel="manifest"> supplies the name and icon.
# - name: required for sites with no manifest, which get a minimal generated one; otherwise the app
#   would be named after the site's host. Overrides the manifest's name when set.
# - icon_url: an icon for sites with no manifest, when their apple-touch-icon or favicon.ico isn't
#   good enough.
# - ignore_on: an optional array of .chezmoi.os values ("darwin", "linux", "windows") to skip the
#   entry on.

[[pwas.entries]]
url = "https://www.appletv.com"
ignore_on = ["darwin", "linux", "windows"]

[[pwas.entries]]
url = "https://www.disneyplus.com"
name = "Disney+"

[[pwas.entries]]
url = "https://nebula.tv"
name = "Nebula"

[[pwas.entries]]
url = "https://www.netflix.com"
name = "Netflix"

[[pwas.entries]]
url = "https://www.paramountplus.com"
name = "Paramount+"

[[pwas.entries]]
url = "https://www.peacocktv.com"
name = "Peacock"

[[pwas.entries]]
url = "https://www.primevideo.com"
name = "Prime Video"

[[pwas.entries]]
url = "https://www.youtube.com"
name = "YouTube"
