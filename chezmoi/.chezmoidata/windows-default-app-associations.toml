# Default app associations to enforce on Windows: file-type extensions (.pdf) and URL protocols
# (http, https) alike.
#
# Windows 11 offers no supported way to set these unattended on a device that isn't domain joined:
#   - UCPD.sys (the User Choice Protection Driver) blocks third-party processes from writing the
#     UserChoice registry key for http, https, .pdf, and other commonly targeted types.
#   - UserChoiceLatest replaces the UserChoice key and hash format with one that includes a machine
#     ID, so a correctly computed legacy hash is ignored on machines that have migrated to it.
#   - The "Set a default associations configuration file" policy (DefaultAssociationsConfiguration)
#     is only processed on domain-joined devices.
# So the Windows default app associations script checks each entry against the default Windows
# actually resolves, and for any mismatch opens that app's page in Settings > Apps > Default apps
# for a one-click fix.
#
# Each entry's app is matched (-match, so it's a regex) against RegisteredApplications entry names,
# per-machine first and then per-user, and must match exactly one installed app. Its desired ProgId
# comes from that app's Capabilities\FileAssociations or \URLAssociations registration rather than
# being hardcoded here, since a ProgId can drift between app versions. An entry whose app isn't
# installed or registered yet is skipped with a warning and picks itself up on a later apply.
[[windows_default_app_associations]]
identifier = ".pdf"
# Acrobat comes from a Creative Cloud sign-in, not winget, so it may not be installed yet.
appNameMatch = "Acrobat"

[[windows_default_app_associations]]
identifier = ".mp4"
appNameMatch = "VLC"

[[windows_default_app_associations]]
identifier = "http"
appNameMatch = "BrowserPicker"

[[windows_default_app_associations]]
identifier = "https"
appNameMatch = "BrowserPicker"
