---
# Setting the default web browser (the http URL scheme, which macOS also
# propagates to https and public.html) always pops a system confirmation
# dialog that a human has to click through — a deliberate anti-hijacking
# measure, not a tooling limitation. duti can't get past this (it just
# errors out non-interactively), so we use utiluti instead: it's a modern,
# signed/notarized replacement that handles the same dialog properly rather
# than choking on it. The command blocks until the dialog is answered — if
# nobody's at the screen, the playbook just waits there — and if the user
# rejects the change, that's a non-zero exit we deliberately don't fail the
# play on (failed_when: false), since a "no" is a valid outcome, not a
# broken run. See https://github.com/scriptingosx/utiluti

- name: Check whether Browsers is installed
  ansible.builtin.stat:
    path: "/Applications/Browsers.app"
  register: browsers_app

- name: Check current default browser
  ansible.builtin.command: utiluti url http --bundle-id
  environment:
    PATH: "/opt/homebrew/bin:{{ ansible_facts.env.PATH }}"
  register: current_default_browser
  when: browsers_app.stat.exists
  changed_when: false
  failed_when: false

# Disabled until https://github.com/Browsers-software/homebrew-tap/pull/3 is merged
# - name: Set Browsers as the default browser
#   ansible.builtin.command: utiluti url set http software.Browsers
#   environment:
#     PATH: "/opt/homebrew/bin:{{ ansible_facts.env.PATH }}"
#   when: browsers_app.stat.exists and current_default_browser.stdout | trim != 'software.Browsers'
#   changed_when: true
#   failed_when: false

# Only types Thunderbird's Info.plist declares (the .eml document type and the
# mailto URL scheme) or that it registers itself for at runtime (webcal and
# webcals). It declares no .ics document type, so utiluti refuses to make it
# the .ics handler.
- name: Check whether Thunderbird is installed
  ansible.builtin.stat:
    path: "/Applications/Thunderbird.app"
  register: thunderbird_app

- name: Make Thunderbird the default mail and calendar subscription app
  when: thunderbird_app.stat.exists and is_personal_machine
  environment:
    PATH: "/opt/homebrew/bin:{{ ansible_facts.env.PATH }}"
  block:
    - name: Check current handlers for mail and calendar URL schemes
      ansible.builtin.command: utiluti url {{ item }} --bundle-id
      loop:
        - mailto
        - webcal
        - webcals
      register: current_url_handlers
      changed_when: false
      failed_when: false

    - name: Set Thunderbird as the handler for mail and calendar URL schemes
      ansible.builtin.command: utiluti url set {{ item.item }} org.mozilla.thunderbird
      loop: "{{ current_url_handlers.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stdout | trim != 'org.mozilla.thunderbird'
      changed_when: true
      failed_when: false

    # .eml is a file-type/UTI association rather than a URL scheme. It's still
    # scriptable as of this writing, but macOS 26.4+ started requiring the
    # same kind of confirmation for some file-type changes too, so this may
    # start prompting the same way on a future OS update.
    - name: Get the UTI for .eml files
      ansible.builtin.command: utiluti get-uti eml
      register: eml_uti
      changed_when: false
      failed_when: false

    - name: Check current handler for .eml files
      ansible.builtin.command: "utiluti type {{ eml_uti.stdout | trim }} --bundle-id"
      register: current_eml_handler
      changed_when: false
      failed_when: false

    - name: Associate .eml files with Thunderbird
      ansible.builtin.command: utiluti type set extension:eml org.mozilla.thunderbird
      when: current_eml_handler.stdout | trim != 'org.mozilla.thunderbird'
      changed_when: true
      failed_when: false
