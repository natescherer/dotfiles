---
# mas can't report sign-in status on current macOS, so attempt the install
# and warn on failure rather than failing the whole run.
- name: Install Mac App Store apps
  block:
    - name: Install Mac App Store apps
      community.general.mas:
        id: "{{ (mac_app_store_apps | combine(mac_app_store_apps_personal | default({}))).values() | list }}"
        state: present
      environment:
        PATH: "/opt/homebrew/bin:{{ ansible_facts.env.PATH }}"
  rescue:
    - name: Warn that Mac App Store apps were not installed
      ansible.builtin.debug:
        msg: >-
          Mac App Store install failed: {{ ansible_failed_result.msg | default('unknown error') }}.
          Make sure you're signed into the App Store app (Settings > Apple
          Account), then re-run this playbook to install Mac App Store apps.
