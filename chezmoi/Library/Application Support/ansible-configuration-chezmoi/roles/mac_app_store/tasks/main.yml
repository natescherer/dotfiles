---
# Calls mas directly: community.general.mas only runs `mas install`, which
# can't install a free app this Apple Account has never gotten (`mas get`).
- name: List installed Mac App Store apps
  ansible.builtin.command: mas list
  environment:
    PATH: "/opt/homebrew/bin:{{ ansible_facts.env.PATH }}"
  register: mas_list
  changed_when: false

# One app per task so a delisted ID or a signed-out App Store only skips
# the affected apps.
- name: Install Mac App Store apps
  ansible.builtin.shell: |
    set -o pipefail
    if mas lookup {{ item.value }} | grep -E '^Price[^A-Za-z]*Free$' >/dev/null; then
      mas get {{ item.value }}
    else
      mas install {{ item.value }}
    fi
  environment:
    PATH: "/opt/homebrew/bin:{{ ansible_facts.env.PATH }}"
  loop: "{{ mac_app_store_apps | combine(mac_app_store_apps_personal | default({})) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: item.value | string not in mas_list.stdout_lines | map('trim') | map('split') | map('first')
  ignore_errors: true
