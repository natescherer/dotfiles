---

- name: Check current appearance mode
  ansible.builtin.command: >-
    osascript -e 'tell application "System Events" to tell appearance preferences to get dark mode'
  register: dark_mode_current
  changed_when: false

- name: Enable Dark Mode
  ansible.builtin.command: >-
    osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to true'
  when: dark_mode_current.stdout | trim != 'true'

# Lives at /Library/Preferences rather than a per-user domain -- macOS reads the system-wide
# copy for this one, not ~/Library/Preferences. Requires Location Services to actually take
# effect, which isn't itself scriptable (no `defaults`/CLI hook for that toggle).
- name: Set time zone automatically using current location
  community.general.osx_defaults:
    domain: /Library/Preferences/com.apple.timezone.auto
    key: Active
    type: bool
    value: true
    state: present
  become: true

- name: Configure Dock behavior
  community.general.osx_defaults:
    domain: com.apple.dock
    key: "{{ item.key }}"
    type: "{{ item.type }}"
    value: "{{ item.value }}"
    state: present
  loop:
    - { key: tilesize, type: float, value: 44.0 }
    - { key: mineffect, type: string, value: genie }
    - { key: minimize-to-application, type: bool, value: true }
    - { key: autohide, type: bool, value: false }
    - { key: launchanim, type: bool, value: true }
    - { key: show-process-indicators, type: bool, value: true }
    - { key: show-recents, type: bool, value: false }
  notify: Restart Dock

- name: Enable Live Text
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: AppleLiveTextEnabled
    type: bool
    value: true
    state: present

- name: Set menu bar clock to analog
  community.general.osx_defaults:
    domain: com.apple.menuextra.clock
    key: IsAnalog
    type: bool
    value: true
    state: present
  notify: Restart Control Center

# Spotlight, Focus, Screen Mirroring, Display, and Timer are all hidden from the menu bar by
# default (no key at all until someone explicitly adds them via System Settings), so there's
# nothing to write for those -- only items that need to move away from their out-of-the-box
# state get an explicit key below. Wi-Fi and Sound are keyed "VisibleCC" (Control Center) since
# that's the toggle that actually controls the menu bar icon here; Battery and Now Playing use
# plain "Visible" instead, matching what's actually in com.apple.controlcenter on an already
# hand-configured Mac.
- name: Configure visible Control Center menu bar items
  community.general.osx_defaults:
    domain: com.apple.controlcenter
    key: "{{ item.key }}"
    type: bool
    value: "{{ item.value }}"
    state: present
  loop:
    - { key: "NSStatusItem Visible Battery", value: false }
    - { key: "NSStatusItem Visible NowPlaying", value: false }
    - { key: "NSStatusItem VisibleCC WiFi", value: true }
    - { key: "NSStatusItem VisibleCC Sound", value: true }
  notify: Restart Control Center

# BatteryShowPercentage lives in the -currentHost variant of this domain, separate from the
# item-visibility keys above (which are host-independent).
- name: Hide battery percentage in the menu bar
  community.general.osx_defaults:
    host: currentHost
    domain: com.apple.controlcenter
    key: BatteryShowPercentage
    type: bool
    value: false
    state: present
  notify: Restart Control Center

# `pmset -c disablesleep 1` doesn't get reported back under that name —
# pmset -g custom doesn't list it at all, at least on hardware without a
# battery. pmset -g (no "custom") shows it as "SleepDisabled" under
# "System-wide power settings:" instead.
- name: Check current SleepDisabled setting
  ansible.builtin.shell: pmset -g | awk '/SleepDisabled/{print $2}'
  register: current_disablesleep
  changed_when: false

- name: Prevent sleep on power adapter when display is off
  ansible.builtin.command: pmset -c disablesleep 1
  become: true
  when: current_disablesleep.stdout | trim != '1'
  changed_when: true

- name: Configure Finder behavior
  community.general.osx_defaults:
    domain: com.apple.finder
    key: "{{ item.key }}"
    type: "{{ item.type }}"
    value: "{{ item.value }}"
    state: present
  loop:
    - { key: NewWindowTarget, type: string, value: PfHm }
    - { key: ShowRecentTags, type: bool, value: false }
    - { key: _FXSortFoldersFirst, type: bool, value: true }
    - { key: ShowTabView, type: bool, value: true }
    - { key: ShowPathbar, type: bool, value: true }
    - { key: ShowStatusBar, type: bool, value: true }
    - { key: FXPreferredViewStyle, type: string, value: Nlsv }
    - { key: AppleShowAllFiles, type: bool, value: true }
  notify: Restart Finder

- name: Show all filename extensions in Finder
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: AppleShowAllExtensions
    type: bool
    value: true
    state: present
  notify: Restart Finder

- name: Enable trackpad tap-to-click
  community.general.osx_defaults:
    domain: com.apple.AppleMultitouchTrackpad
    key: Clicking
    type: bool
    value: true
    state: present

- name: Enable Touch ID for sudo
  ansible.builtin.shell: |
    sed "s/^#auth/auth/" /etc/pam.d/sudo_local.template > /etc/pam.d/sudo_local
  become: true
  args:
    creates: /etc/pam.d/sudo_local
