---

- name: Check current appearance mode
  ansible.builtin.command: >-
    osascript -e 'tell application "System Events" to tell appearance preferences to get dark mode'
  register: dark_mode_current
  changed_when: false

- name: Enable Dark Mode
  ansible.builtin.command: >-
    osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to true'
  when: dark_mode_current.stdout | trim != 'true'

# macOS 26+ "Icon & Widget style" (System Settings > Appearance). Absent until first changed
# from the default; "RegularDark" is the Dark tile.
- name: Set icon and widget style to Dark
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: AppleIconAppearanceTheme
    type: string
    value: RegularDark
    state: present

# Lives at /Library/Preferences rather than a per-user domain -- macOS reads the system-wide
# copy for this one, not ~/Library/Preferences. Requires Location Services to actually take
# effect, which isn't itself scriptable (no `defaults`/CLI hook for that toggle).
- name: Set time zone automatically using current location
  community.general.osx_defaults:
    domain: /Library/Preferences/com.apple.timezone.auto
    key: Active
    type: bool
    value: true
    state: present
  become: true

# tilesize: icon size in points. mineffect: minimize animation (genie or scale).
# minimize-to-application: minimize windows into their app's Dock icon instead of a separate tile.
# launchanim: bounce the icon while an app launches. show-process-indicators: dot under running
# apps. show-recents: the recent-applications section at the right end of the Dock.
- name: Configure Dock behavior
  community.general.osx_defaults:
    domain: com.apple.dock
    key: "{{ item.key }}"
    type: "{{ item.type }}"
    value: "{{ item.value }}"
    state: present
  loop:
    - { key: tilesize, type: float, value: 44.0 }
    - { key: mineffect, type: string, value: genie }
    - { key: minimize-to-application, type: bool, value: true }
    - { key: autohide, type: bool, value: false }
    - { key: launchanim, type: bool, value: true }
    - { key: show-process-indicators, type: bool, value: true }
    - { key: show-recents, type: bool, value: false }
  notify: Restart Dock

- name: Enable Live Text
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: AppleLiveTextEnabled
    type: bool
    value: true
    state: present

# Absent until first changed from the default ("Automatic based on mouse or trackpad").
# Other values: WhenScrolling, Automatic.
- name: Always show scroll bars
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: AppleShowScrollBars
    type: string
    value: Always
    state: present

# "Click in the scroll bar to": true is "Jump to the spot that's clicked", false is "Jump to
# the next page". Absent until first changed from the default.
- name: Jump to the clicked spot when clicking in the scroll bar
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: AppleScrollerPagingBehavior
    type: bool
    value: true
    state: present

# Focus > "Share across devices" is inverted: disableCloudSync true means Off.
- name: Disable sharing Focus across devices
  community.general.osx_defaults:
    domain: com.apple.donotdisturbd
    key: disableCloudSync
    type: bool
    value: true
    state: present

- name: Set menu bar clock to analog
  community.general.osx_defaults:
    domain: com.apple.menuextra.clock
    key: IsAnalog
    type: bool
    value: true
    state: present
  notify: Restart Control Center

# Spotlight, Focus, Screen Mirroring, Display, and Timer are all hidden from the menu bar by
# default (no key at all until someone explicitly adds them via System Settings), so there's
# nothing to write for those -- only items that need to move away from their out-of-the-box
# state get an explicit key below. Wi-Fi and Sound are keyed "VisibleCC" (Control Center) since
# that's the toggle that actually controls the menu bar icon here; Battery and Now Playing use
# plain "Visible" instead, matching what's actually in com.apple.controlcenter on an already
# hand-configured Mac.
- name: Configure visible Control Center menu bar items
  community.general.osx_defaults:
    domain: com.apple.controlcenter
    key: "{{ item.key }}"
    type: bool
    value: "{{ item.value }}"
    state: present
  loop:
    - { key: "NSStatusItem Visible Battery", value: false }
    - { key: "NSStatusItem Visible NowPlaying", value: false }
    - { key: "NSStatusItem VisibleCC WiFi", value: true }
    - { key: "NSStatusItem VisibleCC Sound", value: true }
  notify: Restart Control Center

# BatteryShowPercentage lives in the -currentHost variant of this domain, separate from the
# item-visibility keys above (which are host-independent).
- name: Hide battery percentage in the menu bar
  community.general.osx_defaults:
    host: currentHost
    domain: com.apple.controlcenter
    key: BatteryShowPercentage
    type: bool
    value: false
    state: present
  notify: Restart Control Center

# `pmset -c disablesleep 1` doesn't get reported back under that name —
# pmset -g custom doesn't list it at all, at least on hardware without a
# battery. pmset -g (no "custom") shows it as "SleepDisabled" under
# "System-wide power settings:" instead.
- name: Check current SleepDisabled setting
  ansible.builtin.shell: pmset -g | awk '/SleepDisabled/{print $2}'
  register: current_disablesleep
  changed_when: false

# -c applies only to the power-adapter profile. disablesleep 1 stops the system from sleeping at all
# (lid close included), so the Mac stays reachable while the display is off.
- name: Prevent sleep on power adapter when display is off
  ansible.builtin.command: pmset -c disablesleep 1
  become: true
  when: current_disablesleep.stdout | trim != '1'
  changed_when: true

# NewWindowTarget PfHm: new Finder windows open the home folder. FXPreferredViewStyle Nlsv: list
# view (icnv is icon, clmv column, glyv gallery). _FXSortFoldersFirst: folders sort above files.
# ShowTabView: always show the tab bar. ShowRecentTags: recent tags in the sidebar.
# AppleShowAllFiles: show hidden files.
- name: Configure Finder behavior
  community.general.osx_defaults:
    domain: com.apple.finder
    key: "{{ item.key }}"
    type: "{{ item.type }}"
    value: "{{ item.value }}"
    state: present
  loop:
    - { key: NewWindowTarget, type: string, value: PfHm }
    - { key: ShowRecentTags, type: bool, value: false }
    - { key: _FXSortFoldersFirst, type: bool, value: true }
    - { key: ShowTabView, type: bool, value: true }
    - { key: ShowPathbar, type: bool, value: true }
    - { key: ShowStatusBar, type: bool, value: true }
    - { key: FXPreferredViewStyle, type: string, value: Nlsv }
    - { key: AppleShowAllFiles, type: bool, value: true }
  notify: Restart Finder

- name: Show all filename extensions in Finder
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: AppleShowAllExtensions
    type: bool
    value: true
    state: present
  notify: Restart Finder

# Until System Settings rewrites it as a bool on first toggle, Clicking is stored as integer 0
# (seen on macOS 27), so the module's default type check fails with "Type mismatch"; hence
# check_type: false. The built-in and Bluetooth trackpads have separate domains.
- name: Enable trackpad tap-to-click
  community.general.osx_defaults:
    domain: "{{ item }}"
    key: Clicking
    type: bool
    value: true
    check_type: false
    state: present
  loop:
    - com.apple.AppleMultitouchTrackpad
    - com.apple.driver.AppleBluetoothMultitouch.trackpad

# Tap-to-click is also stored in the per-host global domain, alongside the trackpad domains above.
- name: Enable tap-to-click for the current host
  community.general.osx_defaults:
    host: currentHost
    domain: NSGlobalDomain
    key: com.apple.mouse.tapBehavior
    type: int
    value: 1
    state: present

# sudo_local is the supported place for local PAM overrides (unlike /etc/pam.d/sudo, macOS updates
# don't overwrite it). Its template ships with the pam_tid.so (Touch ID) line commented out; this
# uncomments it. The creates: guard makes this a one-time setup.
- name: Enable Touch ID for sudo
  ansible.builtin.shell: |
    sed "s/^#auth/auth/" /etc/pam.d/sudo_local.template > /etc/pam.d/sudo_local
  become: true
  args:
    creates: /etc/pam.d/sudo_local
